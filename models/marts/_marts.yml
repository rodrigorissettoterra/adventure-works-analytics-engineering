version: 2

models:
  - name: dim_customer
    description: Dimensão conformada de clientes. Utiliza chaves naturais estáveis como chaves dimensionais no MVP e inclui membro desconhecido.
    columns:
      - name: customer_key
        description: Chave primária da dimensão.
        data_tests: [unique, not_null]
      - name: customer_id
        description: Identificador do cliente na origem.
        data_tests: [not_null]
      - name: customer_account_number
        description: Código de conta derivado no padrão Adventure Works.
      - name: person_id
        description: Pessoa associada ao cliente, quando aplicável.
      - name: store_id
        description: Loja associada ao cliente B2B.
      - name: territory_id
        description: Território comercial da origem.
      - name: customer_type
        description: "Tipo do cliente: Store, Individual ou Unknown."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Store', 'Individual', 'Unknown']
      - name: customer_name
        description: Nome analítico principal do cliente.
        data_tests: [not_null]
      - name: contact_person_name
        description: Nome do contato quando disponível.

  - name: dim_product
    description: Dimensão conformada de produtos com hierarquia de categoria e subcategoria.
    columns:
      - name: product_key
        description: Chave primária da dimensão.
        data_tests: [unique, not_null]
      - name: product_id
        description: Identificador do produto na origem.
        data_tests: [not_null]
      - name: product_name
        description: Nome do produto.
        data_tests: [not_null]
      - name: product_number
        description: Código comercial do produto.
      - name: is_manufactured_in_house
        description: Indica fabricação interna.
      - name: is_finished_good
        description: Indica produto acabado.
      - name: color
        description: Cor do produto ou valor padronizado para ausência.
      - name: standard_cost
        description: Custo padrão disponível na origem.
      - name: list_price
        description: Preço de lista.
      - name: size
        description: Tamanho do produto.
      - name: product_line
        description: Linha do produto.
      - name: product_class
        description: Classe do produto.
      - name: product_style
        description: Estilo do produto.
      - name: product_subcategory_id
        description: Identificador da subcategoria.
      - name: product_subcategory_name
        description: Nome da subcategoria.
      - name: product_category_id
        description: Identificador da categoria.
      - name: product_category_name
        description: Nome da categoria.
      - name: sell_start_date
        description: Início de comercialização.
      - name: sell_end_date
        description: Fim de comercialização.
      - name: discontinued_date
        description: Data de descontinuação.

  - name: dim_location
    description: Dimensão geográfica baseada no endereço de entrega.
    columns:
      - name: location_key
        description: Chave primária da dimensão.
        data_tests: [unique, not_null]
      - name: address_id
        description: Identificador do endereço na origem.
        data_tests: [not_null]
      - name: city
        description: Cidade de entrega.
        data_tests: [not_null]
      - name: postal_code
        description: Código postal.
      - name: state_province_id
        description: Identificador do estado ou província.
      - name: state_province_code
        description: Código do estado ou província.
      - name: state_province_name
        description: Nome do estado ou província.
      - name: country_region_code
        description: Código do país.
      - name: country_name
        description: Nome do país.
      - name: territory_id
        description: Território comercial relacionado.

  - name: dim_credit_card
    description: Dimensão minimizada de cartões contendo apenas o tipo analítico.
    columns:
      - name: credit_card_key
        description: Chave primária da dimensão.
        data_tests: [unique, not_null]
      - name: credit_card_id
        description: Identificador do cartão na origem.
        data_tests: [not_null]
      - name: card_type
        description: Tipo do cartão ou membro desconhecido.
        data_tests: [not_null]

  - name: dim_sales_reason
    description: Dimensão de motivos de venda.
    columns:
      - name: sales_reason_key
        description: Chave primária da dimensão.
        data_tests: [unique, not_null]
      - name: sales_reason_id
        description: Identificador do motivo na origem.
        data_tests: [not_null]
      - name: sales_reason_name
        description: Nome do motivo.
        data_tests: [not_null]
      - name: sales_reason_type
        description: Tipo do motivo, incluindo Promotion.
        data_tests: [not_null]

  - name: dim_order_status
    description: Dimensão controlada de status do pedido.
    columns:
      - name: status_key
        description: Chave primária da dimensão.
        data_tests: [unique, not_null]
      - name: status_code
        description: Código da origem.
        data_tests: [unique, not_null]
      - name: status_name
        description: Descrição legível.
        data_tests: [not_null]

  - name: dim_date
    description: Dimensão calendário gerada entre as datas mínima e máxima dos pedidos.
    columns:
      - name: date_key
        description: Chave primária da dimensão e data civil.
        data_tests: [unique, not_null]
      - name: year
        description: Ano civil.
        data_tests: [not_null]
      - name: quarter
        description: Trimestre civil.
        data_tests: [not_null]
      - name: month_number
        description: Número do mês.
        data_tests: [not_null]
      - name: month_name
        description: Nome do mês conforme locale do mecanismo SQL.
      - name: year_month
        description: Identificador no formato AAAA-MM.
        data_tests: [not_null]
      - name: week_of_year
        description: Semana do ano.
      - name: day_of_month
        description: Dia do mês.
      - name: day_of_week_number
        description: Número do dia da semana.
      - name: day_of_week_name
        description: Nome do dia da semana.
      - name: is_month_start
        description: Indicador de primeiro dia do mês.
      - name: is_month_end
        description: Indicador de último dia do mês.
      - name: is_year_start
        description: Indicador de primeiro dia do ano.
      - name: is_year_end
        description: Indicador de último dia do ano.

  - name: fct_sales
    description: Fato de vendas no grão de item do pedido. É a fonte oficial para produto, unidades, desconto e receita líquida.
    columns:
      - name: sales_order_detail_id
        description: Chave primária do item do pedido.
        data_tests: [unique, not_null]
      - name: sales_order_id
        description: Identificador degenerado do pedido.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_sales_orders')
                field: sales_order_id
      - name: order_date_key
        description: Data do pedido.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: customer_key
        description: Chave estrangeira de cliente.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key
      - name: product_key
        description: Chave estrangeira de produto.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key
      - name: location_key
        description: Chave estrangeira da localização de entrega.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_location')
                field: location_key
      - name: credit_card_key
        description: Chave estrangeira de cartão.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_credit_card')
                field: credit_card_key
      - name: status_key
        description: Chave estrangeira de status.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_order_status')
                field: status_key
      - name: sales_channel
        description: Canal Online ou Reseller.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Online', 'Reseller']
      - name: special_offer_id
        description: Oferta especial registrada no item.
      - name: order_quantity
        description: Quantidade vendida.
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 1
      - name: unit_price
        description: Preço unitário aplicado.
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
      - name: unit_price_discount_pct
        description: Percentual de desconto no intervalo de zero a um.
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: gross_sales_amount
        description: Quantidade multiplicada pelo preço unitário, antes do desconto.
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
      - name: discount_amount
        description: Valor monetário do desconto.
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
      - name: net_sales_amount
        description: Receita líquida de produto após desconto; métrica oficial de valor transacionado no dashboard.
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0

  - name: fct_sales_orders
    description: Fato no grão do pedido para métricas de subtotal, tributos, frete e total devido.
    columns:
      - name: sales_order_id
        description: Chave primária do pedido.
        data_tests: [unique, not_null]
      - name: sales_order_number
        description: Número legível do pedido.
        data_tests: [unique, not_null]
      - name: order_date_key
        description: Data do pedido.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: due_date
        description: Data prevista de atendimento.
        data_tests: [not_null]
      - name: ship_date
        description: Data de envio, quando disponível.
      - name: customer_key
        description: Chave estrangeira de cliente.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key
      - name: location_key
        description: Chave estrangeira da localização de entrega.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_location')
                field: location_key
      - name: credit_card_key
        description: Chave estrangeira de cartão.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_credit_card')
                field: credit_card_key
      - name: status_key
        description: Chave estrangeira de status.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_order_status')
                field: status_key
      - name: sales_channel
        description: Canal Online ou Reseller.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Online', 'Reseller']
      - name: order_subtotal
        description: Soma da receita líquida dos itens do pedido.
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
      - name: tax_amount
        description: Tributos do pedido.
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
      - name: freight_amount
        description: Frete do pedido.
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
      - name: transaction_total
        description: Valor total devido no pedido.
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0

  - name: bridge_order_sales_reason
    description: Ponte entre pedidos e motivos de venda. Não contém métricas aditivas.
    columns:
      - name: order_sales_reason_key
        description: Chave primária composta materializada como texto.
        data_tests: [unique, not_null]
      - name: sales_order_id
        description: Pedido associado.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_sales_orders')
                field: sales_order_id
      - name: sales_reason_key
        description: Chave estrangeira do motivo.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_sales_reason')
                field: sales_reason_key
      - name: reason_count
        description: Quantidade de motivos associados ao pedido.
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 1
      - name: allocation_weight
        description: Peso fracionário igual a um dividido pela quantidade de motivos do pedido.
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1
