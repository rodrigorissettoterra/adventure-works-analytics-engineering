name: dbt-parse

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-dbt-project:
    runs-on: ubuntu-latest
    env:
      DBT_DATABRICKS_CATALOG: ci_catalog
      DBT_DATABRICKS_SCHEMA: ci_schema
      DBT_DATABRICKS_HOST: https://example.invalid
      DBT_DATABRICKS_HTTP_PATH: /sql/1.0/warehouses/ci
      DBT_DATABRICKS_TOKEN: ci-placeholder
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dbt Databricks adapter
        run: python -m pip install --upgrade pip dbt-databricks

      - name: Prepare CI profile
        run: cp profiles.yml.example profiles.yml

      - name: Parse dbt project
        run: dbt parse --profiles-dir .
